<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>என் சொந்த வெப்சைட்</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            text-align: center;
            padding: 50px;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 {
            color: #0d47a1;
        }
        p {
            color: #333;
            font-size: 18px;
        }
        .btn {
            background-color: #ff9800;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>வணக்கம்! இது என் முதல் வெப்சைட் 🚀</h1>
        <p>நான் HTML மற்றும் CSS கற்றுக்கொண்டு இதை நானே உருவாக்கியுள்ளேன்.</p>
        <a class="btn" href="https://www.google.com" target="_blank">Google தளத்திற்குச் செல்ல</a>
    </div>

</body>
</html>
